        - name: Update APT package index
          ansible.builtin.apt:
            update_cache: true

        - name: Install Polychromatic
          ansible.builtin.apt:
            pkg:
              - polychromatic
              - openrazer-meta

        - name: Add user to the plugdev group
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            groups: plugdev
            append: true

    - name: Ensure software for private use available from snap is installed
      become: true
      community.general.snap:
        name:
          - discord

    - name: Ensure IntelliJ IDEA Community is installed from snap
      become: true
      community.general.snap:
        name: intellij-idea-community
        classic: true

    - name: Setup Flatpak and Flathub on Ubuntu
      when: not ansible_check_mode
      become: true
      block:
        - name: Install Flatpak
          ansible.builtin.apt:
            name: flatpak
            state: present
            update_cache: true

        - name: Add Flathub remote repository
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: system

    - name: Ensure software for private use available from Flathub is installed
      when: not ansible_check_mode
      community.general.flatpak:
        name:
          - com.valvesoftware.Steam
          - com.vysp3r.ProtonPlus
          - io.github.benjamimgois.goverlay
          - com.heroicgameslauncher.hgl
          - com.orcaslicer.OrcaSlicer
        state: present
        remote: flathub

    - name: Ensure Steam Flatpak overrides
      when: not ansible_check_mode
      block:
        - name: Steam Flatpak | Ensure overrides directory exists
          ansible.builtin.file:
            path: /home/{{ ansible_facts['user_id'] }}/.local/share/flatpak/overrides
            state: directory
            mode: "0755"

        - name: Steam Flatpak | Allow session D-Bus talk
          community.general.ini_file:
            path: /home/{{ ansible_facts['user_id'] }}/.local/share/flatpak/overrides/com.valvesoftware.Steam
            section: Session Bus Policy
            option: "{{ item }}"
            value: talk
            mode: "0644"
          loop:
            - org.freedesktop.Flatpak

        - name: Steam Flatpak | Enable MangoHud
          community.general.ini_file:
            path: /home/{{ ansible_facts['user_id'] }}/.local/share/flatpak/overrides/com.valvesoftware.Steam
            section: Environment
            option: MANGOHUD
            value: "1"
            mode: "0644"

    - name: Ensure Linux Game Bench is installed
      block:
        - name: Linux Game Bench | Install dependencies
          ansible.builtin.apt:
            pkg:
              - mangohud
              - vulkan-tools
            state: present
            update_cache: true
          become: true

        - name: Linux Game Bench | Install via pipx
          community.general.pipx:
            name: linuxgamebench
            source: git+https://github.com/taaderbe/linuxgamebench.git
            state: present

    - name: Mount DiskStation shares with autofs
      when: not ansible_check_mode
      become: true
      block:
        - name: Ensure nfs-common and autofs are installed
          ansible.builtin.apt:
            name:
              - nfs-common
              - autofs
            state: present

        - name: Ensure auto.master contains the autofs configuration
          ansible.builtin.lineinfile:
            path: /etc/auto.master
            line: "/- /etc/auto.home"
            state: present

        - name: Create necessary mount point directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_id'] }}"
            mode: "0755"
          loop:
            - "/home/{{ ansible_facts['user_id'] }}/Music/AudioStation"
            - "/home/{{ ansible_facts['user_id'] }}/Videos/VideoStation"
            - "/home/{{ ansible_facts['user_id'] }}/Pictures/PhotoStation"
            - "/home/{{ ansible_facts['user_id'] }}/Downloads/DownloadStation"
            - "/home/{{ ansible_facts['user_id'] }}/Backup"

        - name: Deploy the auto.home file with dynamic username
          ansible.builtin.template:
            src: auto.home.j2
            dest: /etc/auto.home
            owner: root
            group: root
            mode: "0644"

        - name: Reload autofs service
          ansible.builtin.service:
            name: autofs
            state: reloaded
